<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School Lost and Found System</title>
  <style>
/* ===== Basic reset and page ===== */
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: "Segoe UI", Arial, sans-serif;
  background: #f1f5f9;
  color: #1e293b;
  line-height: 1.5;
}

/* ===== Header and footer ===== */
.site-header {
  background: #1d4ed8;
  color: #fff;
  text-align: center;
  padding: 28px 16px;
}

.site-header h1 {
  margin: 0 0 6px;
}

.site-header p {
  margin: 0;
  opacity: 0.9;
}

.site-footer {
  text-align: center;
  padding: 18px;
  font-size: 0.85rem;
  color: #64748b;
}

/* ===== Layout ===== */
.container {
  max-width: 1000px;
  margin: 24px auto;
  padding: 0 16px;
}

.container h2 {
  margin: 24px 0 12px;
}

.card {
  background: #fff;
  border-radius: 10px;
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
}

.card h2 {
  margin-top: 0;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 14px;
  margin-bottom: 14px;
}

/* ===== Form ===== */
label {
  display: block;
  font-weight: 600;
  font-size: 0.9rem;
}

input,
select,
textarea {
  display: block;
  width: 100%;
  margin-top: 5px;
  padding: 9px 10px;
  font: inherit;
  font-weight: normal;
  border: 1px solid #cbd5e1;
  border-radius: 6px;
  background: #fff;
}

input:focus,
select:focus,
textarea:focus {
  outline: 2px solid #93c5fd;
  border-color: #1d4ed8;
}

textarea {
  resize: vertical;
}

.error {
  min-height: 1.2em;
  margin: 10px 0;
  color: #dc2626;
  font-weight: 600;
}

/* ===== Buttons ===== */
.btn {
  border: none;
  border-radius: 6px;
  padding: 9px 16px;
  font: inherit;
  font-weight: 600;
  color: #fff;
  cursor: pointer;
}

.btn:hover {
  opacity: 0.88;
}

.btn.primary { background: #1d4ed8; }
.btn.success { background: #16a34a; }
.btn.danger  { background: #dc2626; }

/* ===== Item cards ===== */
.item-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}

.item {
  background: #fff;
  border-radius: 10px;
  padding: 16px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
  border-left: 6px solid #94a3b8;
}

.item.Lost  { border-left-color: #dc2626; }
.item.Found { border-left-color: #16a34a; }

.item h3 {
  margin: 10px 0 8px;
}

.item p {
  margin: 4px 0;
  font-size: 0.92rem;
  word-wrap: break-word;
}

.item.claimed {
  opacity: 0.65;
}

.item.claimed h3 {
  text-decoration: line-through;
}

/* ===== Badges ===== */
.badge {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 999px;
  font-size: 0.78rem;
  font-weight: 700;
  color: #fff;
  background: #64748b;
}

.item.Lost  .badge:first-child { background: #dc2626; }
.item.Found .badge:first-child { background: #16a34a; }

/* The JavaScript does not write these texts, so CSS adds them */
.badge.status {
  background: #f59e0b;
}

.badge.status::after {
  content: "Open";
}

.item.claimed .badge.status {
  background: #2563eb;
}

.item.claimed .badge.status::after {
  content: "Claimed / Returned";
}

.claim-btn::after {
  content: "Mark as Claimed";
}

.item.claimed .claim-btn::after {
  content: "Mark as Open";
}

.actions {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

/* ===== Empty message ===== */
.empty {
  text-align: center;
  color: #64748b;
  padding: 20px;
}
  </style>
</head>
<body>

  <header class="site-header">
    <h1>🎒 School Lost and Found</h1>
    <p>Report a lost item, post a found item, and help everyone get their belongings back.</p>
  </header>

  <main class="container">

    <!-- Report form (the browser checks the "required" fields by itself) -->
    <section class="card">
      <h2>Report an Item</h2>
      <form id="itemForm">
        <div class="grid">
          <label>Report Type
            <select id="type">
              <option value="Lost">I lost something</option>
              <option value="Found">I found something</option>
            </select>
          </label>

          <label>Item Name
            <input type="text" id="name" placeholder="e.g. Blue Umbrella" required>
          </label>

          <label>Category
            <select id="category" required>
              <option value="">-- Select --</option>
              <option>Bag</option>
              <option>Electronics</option>
              <option>ID / Cards</option>
              <option>Books / School Supplies</option>
              <option>Clothing</option>
              <option>Keys</option>
              <option>Others</option>
            </select>
          </label>

          <label><span id="areaLabel">Location Lost: Area / Building</span>
            <select id="area" required>
              <option value="">-- Select --</option>
              <option>Library</option>
              <option>Canteen</option>
              <option>Gymnasium</option>
              <option>Classroom</option>
              <option>Hallway / Stairs</option>
              <option>Restroom</option>
              <option>Quadrangle / Grounds</option>
              <option>Parking Area</option>
              <option>Others</option>
            </select>
          </label>

          <label><span id="locationLabel">Location Lost: Specific Spot</span>
            <input type="text" id="location" placeholder="e.g. Room 204, 2nd row, near the window" required>
          </label>

          <label><span id="dateLabel">Date Lost</span>
            <input type="date" id="date" required>
          </label>

          <label><span id="timeLabel">Time Lost</span>
            <input type="time" id="time" required>
          </label>

          <label>Contact Person / Number
            <input type="text" id="contact" placeholder="Name or phone / email" required>
          </label>
        </div>

        <label>Description
          <textarea id="description" rows="3" placeholder="Color, brand, marks, etc."></textarea>
        </label>

        <p id="formError" class="error" role="alert"></p>
        <button type="submit" class="btn primary">Submit Report</button>
      </form>
    </section>

    <!-- Search and filter -->
    <section class="card">
      <h2>Search Items</h2>
      <div class="grid">
        <input type="text" id="search" placeholder="Search by name, location, or description...">
        <select id="filterType">
          <option value="All">All Types</option>
          <option value="Lost">Lost</option>
          <option value="Found">Found</option>
        </select>
        <select id="filterStatus">
          <option value="All">All Status</option>
          <option value="Open">Open</option>
          <option value="Claimed">Claimed / Returned</option>
        </select>
      </div>
    </section>

    <!-- Item list -->
    <section>
      <h2>Reported Items</h2>
      <div id="itemList" class="item-list"></div>
      <p id="emptyMsg" class="empty">No items to show.</p>
    </section>

  </main>

  <footer class="site-footer">
    <p>School Lost and Found System &middot; Final Exam Project &middot; HTML, CSS, JavaScript</p>
  </footer>

  <!-- Card layout lives here in HTML; JavaScript only fills in the text -->
  <template id="cardTemplate">
    <article class="item">
      <div>
        <span class="badge" data-field="type"></span>
        <span class="badge status"></span>
      </div>
      <h3 data-field="name"></h3>
      <p>Category: <span data-field="category"></span></p>
      <p><span data-field="locationLabel"></span>: <span data-field="location"></span></p>
      <p><span data-field="dateLabel"></span>: <span data-field="date"></span></p>
      <p><span data-field="timeLabel"></span>: <span data-field="time"></span></p>
      <p>Contact: <span data-field="contact"></span></p>
      <p>Details: <span data-field="description"></span></p>
      <div class="actions">
        <button type="button" class="btn success claim-btn"></button>
        <button type="button" class="btn danger delete-btn">Delete</button>
      </div>
    </article>
  </template>

  <script>
// JavaScript is used ONLY for the interactive parts:
// submit form, search/filter, claim, delete, and saving in the browser.

let items = JSON.parse(localStorage.getItem("lostAndFound")) || [];

const form = document.getElementById("itemForm");
const formError = document.getElementById("formError");
const itemList = document.getElementById("itemList");
const emptyMsg = document.getElementById("emptyMsg");
const searchInput = document.getElementById("search");
const filterType = document.getElementById("filterType");
const filterStatus = document.getElementById("filterStatus");
const template = document.getElementById("cardTemplate");
const typeInput = document.getElementById("type");
const dateInput = document.getElementById("date");

function save() {
  localStorage.setItem("lostAndFound", JSON.stringify(items));
}

// Date cannot be later than today
dateInput.max = new Date().toLocaleDateString("en-CA");

// Labels change to "Lost" or "Found" depending on the report type
function updateLabels() {
  const word = typeInput.value; // "Lost" or "Found"
  document.getElementById("areaLabel").textContent = "Location " + word + ": Area / Building";
  document.getElementById("locationLabel").textContent = "Location " + word + ": Specific Spot";
  document.getElementById("dateLabel").textContent = "Date " + word;
  document.getElementById("timeLabel").textContent = "Time " + word;
}
typeInput.addEventListener("change", updateLabels);

// Turn "14:30" into "2:30 PM"
function formatTime(time) {
  if (!time) return "Not specified";
  return new Date("1970-01-01T" + time).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
}

// Add a report
form.addEventListener("submit", function (event) {
  event.preventDefault();

  // Item name has no length limit, it just can't be blank spaces
  const name = document.getElementById("name").value.trim();
  if (name === "") {
    formError.textContent = "Please enter the item name.";
    return;
  }

  // Date and time cannot be in the future
  const when = new Date(dateInput.value + "T" + document.getElementById("time").value);
  if (when > new Date()) {
    formError.textContent = "Date and time cannot be in the future.";
    return;
  }

  // Area + specific spot, e.g. "Library - 2nd floor, near the printers"
  const location = document.getElementById("area").value + " - " +
                   document.getElementById("location").value.trim();

  items.unshift({
    id: Date.now(),
    type: typeInput.value,
    name: name,
    category: document.getElementById("category").value,
    location: location,
    date: dateInput.value,
    time: document.getElementById("time").value,
    contact: document.getElementById("contact").value.trim(),
    description: document.getElementById("description").value.trim() || "None",
    claimed: false
  });

  save();
  formError.textContent = "";
  form.reset();
  updateLabels();
  render();
});

// Search and filter
searchInput.addEventListener("input", render);
filterType.addEventListener("change", render);
filterStatus.addEventListener("change", render);

// Claim and delete buttons (one listener for all cards)
itemList.addEventListener("click", function (event) {
  const card = event.target.closest(".item");
  if (!card) return;
  const id = Number(card.dataset.id);

  if (event.target.classList.contains("claim-btn")) {
    const item = items.find(function (i) { return i.id === id; });
    item.claimed = !item.claimed;
  } else if (event.target.classList.contains("delete-btn")) {
    if (!confirm("Delete this report?")) return;
    items = items.filter(function (i) { return i.id !== id; });
  } else {
    return;
  }

  save();
  render();
});

// Show the items that match the search and filters
function render() {
  const keyword = searchInput.value.toLowerCase().trim();
  itemList.innerHTML = "";
  let shown = 0;

  items.forEach(function (item) {
    const text = (item.name + item.location + item.description + item.category).toLowerCase();
    if (!text.includes(keyword)) return;
    if (filterType.value !== "All" && item.type !== filterType.value) return;
    if (filterStatus.value === "Open" && item.claimed) return;
    if (filterStatus.value === "Claimed" && !item.claimed) return;

    const card = template.content.cloneNode(true).querySelector(".item");
    card.dataset.id = item.id;
    card.classList.add(item.type);
    if (item.claimed) card.classList.add("claimed");

    // Values shown on the card (labels follow the report type)
    const values = Object.assign({}, item, {
      locationLabel: "Location " + item.type,
      dateLabel: "Date " + item.type,
      timeLabel: "Time " + item.type,
      time: formatTime(item.time)
    });

    card.querySelectorAll("[data-field]").forEach(function (el) {
      el.textContent = values[el.dataset.field];
    });

    itemList.appendChild(card);
    shown++;
  });

  emptyMsg.style.display = shown === 0 ? "block" : "none";
}

updateLabels();
render();
  </script>
</body>
</html>
